{{ define "main" }}
<main class="list">
  <div class="topbar">
    <a class="topbar-link" href="/">返回首页</a>
  </div>
  <header class="list-header">
    <h1 class="list-title">{{ .Title }}</h1>
    {{ with .Description }}
    <div class="list-desc">{{ . }}</div>
    {{ end }}
  </header>
  <div class="list-content">
    {{ with .Content }}
    <div class="list-body">{{ . }}</div>
    {{ end }}
    <ul class="list-items">
      {{ range .Pages }}
      <li class="list-item">
        <a class="list-link" href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ with .Summary }}
        <div class="list-summary">{{ . }}</div>
        {{ end }}
      </li>
      {{ end }}
    </ul>
  </div>
</main>
{{ end }}
