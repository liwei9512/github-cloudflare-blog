name: Sync to public release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH for public repo push
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add GitHub to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Clone public repo release branch
        run: |
          git clone --branch public/release git@github.com:liwei9512/github-cloudflare-blog.git public-release

      - name: Sync repository content
        run: |
          rsync -a --delete --exclude '.git' --exclude 'public-release' ./ public-release/

      - name: Commit and push to public repo
        run: |
          cd public-release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync from blogs@${GITHUB_SHA}"
            git push origin public/release
          else
            echo "No changes to publish."
          fi
