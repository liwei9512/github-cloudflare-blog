name: PR Validate (Hugo build)

on:
  pull_request:
    branches:
      - main

jobs:
  hugo-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo (lint)
        run: hugo --minify -d public

